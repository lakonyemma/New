name: Build and test Workwise MVC
on: [push, pull_request]
jobs:
  mvc:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: workwise_mvc_test
          MYSQL_USER: workwise_mvc
          MYSQL_PASSWORD: test_only_password
          MYSQL_ROOT_PASSWORD: test_only_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -ptest_only_root_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://127.0.0.1:5080
      Bootstrap__Password: temporary_admin_test_password_123!
      ConnectionStrings__Workwise: 'Server=127.0.0.1;Port=3306;Database=workwise_mvc_test;User ID=workwise_mvc;Password=test_only_password;SslMode=Preferred'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore & compile MVC and Razor Views
        run: dotnet build Workwise.Mvc.csproj --configuration Release
      - name: Start MVC site
        run: |
          nohup dotnet run --project Workwise.Mvc.csproj --no-build --no-launch-profile --configuration Release > /tmp/workwise-mvc.log 2>&1 &
          echo $! > /tmp/workwise-mvc.pid
      - name: Execute end-to-end MySQL smoke checks
        run: python3 tests/smoke.py
      - name: Print application logs if tests fail
        if: failure()
        run: tail -150 /tmp/workwise-mvc.log || true
      - name: Stop MVC site
        if: always()
        run: |
          if [ -f /tmp/workwise-mvc.pid ]; then kill $(cat /tmp/workwise-mvc.pid) || true; fi
