services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: workwise_db
      MYSQL_USER: workwise
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL","mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 20
  migrator:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      ConnectionStrings__DefaultConnection: "server=db;port=3306;database=workwise_db;user=workwise;password=${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD}"
      Database__ApplyMigrationsOnStartup: "false"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    command: ["sh", "/workspace/scripts/migrate.sh"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: Workwise.Web/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "server=db;port=3306;database=workwise_db;user=workwise;password=${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD}"
      Database__ApplyMigrationsOnStartup: "true"
      InitialSetup__Enabled: "${INITIAL_SETUP_ENABLED:-false}"
      InitialSetup__Token: "${INITIAL_SETUP_TOKEN:-}"
    depends_on:
      migrator:
        condition: service_completed_successfully
volumes:
  mysql_data:
